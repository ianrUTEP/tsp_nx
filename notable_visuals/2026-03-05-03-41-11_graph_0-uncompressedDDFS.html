                  var options = {"edges": {"color": {"inherit": "true"}, "smooth": {"enabled": false, "type": "dynamic"}, "scaling": {"min": 1, "max": 5, "label": {"enabled": false}}}, "interaction": {"dragNodes": false, "dragView": true, "hideEdgesOnDrag": false}, "physics": {"enabled": false, "stabilization": {"enabled": true, "iterations": 1000, "updateInterval": 100, "onlyDynamicEdges": false, "fit": true}}, "configure": {"enabled": true}};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
